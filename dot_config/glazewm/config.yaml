# GlazeWM tiles windows. Its keys live in ../autohotkey/main.ahk, which calls the
# glazewm CLI: tap Right Alt then an arrow focuses, hold Right Alt+arrow moves.
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'window_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#8dbcff'
  other_windows:
    border:
      enabled: false
      color: '#a1a1a1'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'Raycast' }
      - window_process: { equals: 'Wispr Flow' }
      - window_process: { equals: 'ShareX' }
      - window_process: { equals: 'SnippingTool' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes: []

keybindings: []
