; Right Alt app mappings.
; Format: key=Display name|AutoHotkey WinTitle criteria|Run command|Browser tab
; Use Right Alt+Ctrl+key while an app is focused to replace a mapping locally.
; The run command expands %VARS%. The optional browser tab is an address to find
; with the browser's tab search, opened in a new tab when none matches. Right
; Alt+0 is the previous app and takes no mapping.
;
; "- Brave" in the criteria matches normal Brave windows and skips --app windows
; such as Gmail. There is no Ghostty build on Windows, so m opens Windows
; Terminal on the Arch WSL profile instead.

[apps]
7=Claude|ahk_exe Claude.exe|explorer.exe shell:AppsFolder\Claude_pzs8sxrjxfjjc!Claude
8=Slack|ahk_exe slack.exe|%LOCALAPPDATA%\slack\slack.exe
9=GitHub|- Brave ahk_exe brave.exe|brave.exe https://github.com|github.com
c=Claude|ahk_exe Claude.exe|explorer.exe shell:AppsFolder\Claude_pzs8sxrjxfjjc!Claude
f=File Explorer|ahk_class CabinetWClass|explorer.exe
g=Gmail|Gmail ahk_exe brave.exe|brave.exe --app=https://mail.google.com/
k=Claude|ahk_exe Claude.exe|explorer.exe shell:AppsFolder\Claude_pzs8sxrjxfjjc!Claude
l=Linear|ahk_exe Linear.exe|%LOCALAPPDATA%\Programs\Linear\Linear.exe
m=Terminal|ahk_exe WindowsTerminal.exe|wt.exe -p archlinux
n=Notepad|ahk_exe Notepad.exe|notepad.exe
o=Slack|ahk_exe slack.exe|%LOCALAPPDATA%\slack\slack.exe
p=Brave|- Brave ahk_exe brave.exe|brave.exe
x=Codex|ahk_exe ChatGPT.exe|explorer.exe shell:AppsFolder\OpenAI.Codex_2p2nqsd0c76g0!App
