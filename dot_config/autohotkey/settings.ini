[features]
; Opt in only if the Lofree media keys should stop controlling volume.
; AutoHotkey alone cannot limit these hotkeys to one physical keyboard.
lofree_scroll=0

; Translate Cmd-style (left Win) combos into the Ctrl+Shift combos a terminal
; expects, but only while a terminal from the terminalProcesses map in main.ahk
; is focused. Set to 0 if a terminal starts swallowing the wrong keys.
terminal_modifier_swap=1

[scroll]
; Add comma-separated names discovered with AutoHotkey Key History if needed.
up_hotkeys=Volume_Up
down_hotkeys=Volume_Down
delta=72
steps=7
delay_ms=4
