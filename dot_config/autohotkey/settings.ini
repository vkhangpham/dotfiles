[features]
; Opt in only if the Lofree media keys should stop controlling volume.
; AutoHotkey alone cannot limit these hotkeys to one physical keyboard.
lofree_scroll=0

[scroll]
; Add comma-separated names discovered with AutoHotkey Key History if needed.
up_hotkeys=Volume_Up
down_hotkeys=Volume_Down
delta=72
steps=7
delay_ms=4
