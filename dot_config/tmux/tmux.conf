# Prefix
unbind C-b
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix
bind C-a send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation and splitting
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind H previous-window
bind J next-window
bind K previous-window
bind L next-window
bind X kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-S-Left swap-window -t -1 \; previous-window
bind -n M-S-Right swap-window -t +1 \; next-window

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind Delete kill-session
bind P switch-client -p
bind N switch-client -n
bind f new-window "tmux-sessionizer"

bind -n M-j switch-client -n
bind -n M-k switch-client -p

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on

# Mouse wheel scrollback
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{mouse_any_flag}}" "select-pane -t= ; send-keys -M" "select-pane -t= ; copy-mode -e ; send-keys -M"
bind -T root WheelDownPane select-pane -t= \; send-keys -M
bind -T copy-mode-vi WheelUpPane select-pane -t= \; send-keys -X -N 10 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane -t= \; send-keys -X -N 10 scroll-down

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme: Catppuccin Mocha
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#cdd6f4,bg=#1e1e2e] "
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6c7086,bg=#1e1e2e]#h "
set -g window-status-format "#[fg=#6c7086,bg=#1e1e2e] #I:#W "
set -g window-status-current-format "#[fg=#89b4fa,bg=#1e1e2e,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#89b4fa"
set -g message-command-style "bg=#313244,fg=#89b4fa"
set -g mode-style "bg=#89b4fa,fg=#1e1e2e"
setw -g clock-mode-colour "#89b4fa"
