# ThePrimeagen tmux-sessionizer config
# Search these roots for projects/sessions. Entries may be suffixed with :depth.
#
# Keep ~/work lowercase. macOS is case-insensitive so either spelling resolves
# there, but on Linux/WSL ~/Work and ~/work are two different directories -- and
# lowercase is the one dot_config/git/config.tmpl scopes the work identity to
# (includeIf "gitdir:~/work/"). Capitalised here meant this never matched on Linux.
TS_SEARCH_PATHS=($HOME:1 ~/work:2 ~/Code:2 ~/Research:2 ~/Study:2 ~/Documents:2 ~/Servers/:2)

# Example long-running per-session commands. Uncomment and customize if wanted.
# TS_SESSION_COMMANDS=("nvim ." "lazygit")

# Optional logging for debugging:
# TS_LOG=echo
# TS_LOG=file
# TS_LOG_FILE=~/.local/share/tmux-sessionizer/tmux-sessionizer.logs
